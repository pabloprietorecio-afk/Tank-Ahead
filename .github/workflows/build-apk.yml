name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"
  BASE_VERSION: "0.1"
  ANDROID_PLATFORM: "35"
  ANDROID_BUILD_TOOLS: "35.0.1"
  ANDROID_NDK: "28.1.13356709"
  ANDROID_CMAKE: "3.10.2.4988404"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Versión (sube sola en cada compilación)
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "VERSION_NAME=${BASE_VERSION}.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Instalar Godot y plantillas de exportación
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          curl -fsSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}
          unzip -q templates.tpz -d tpl
          mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/

      # Con Gradle el APK lleva los plugins de AdMob y de Google Play Billing (sin Gradle se omiten).
      # Equivale a «Proyecto > Instalar plantilla de compilación de Android» del editor.
      - name: Instalar plantilla de compilación de Android (Gradle)
        run: |
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}
          mkdir -p android/build
          unzip -q "$TPL/android_source.zip" -d android/build
          echo "${GODOT_VERSION}.${GODOT_CHANNEL}" > android/.build_version
          touch android/build/.gdignore
      # Las versiones del SDK salen de la propia plantilla de Godot, para que no se desajusten.
      - name: Instalar Android SDK (versiones de la plantilla)
        run: |
          CFG=android/build/config.gradle
          COMPILE=$(grep -E "^\s*compileSdk\s*:" $CFG | grep -o '[0-9]\+' | head -1)
          BTOOLS=$(grep -E "^\s*buildTools\s*:" $CFG | grep -o "'[^']*'" | tr -d "'")
          NDK=$(grep -E "^\s*ndkVersion\s*:" $CFG | grep -o "'[^']*'" | tr -d "'")
          echo "compileSdk=$COMPILE buildTools=$BTOOLS ndk=$NDK"
          test -n "$COMPILE" -a -n "$BTOOLS" -a -n "$NDK"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;${BTOOLS}" "platforms;android-${COMPILE}" "ndk;${NDK}" \
            "cmake;3.10.2.4988404"
      # Plugin propio de reconocimiento de voz (micrófono de órdenes): se compila aquí con javac,
      # contra el android.jar del SDK y la godot-lib de la plantilla (android_plugins/speech_commands).
      - name: Compilar plugin de voz (SpeechCommands)
        run: |
          COMPILE=$(grep -E "^\s*compileSdk\s*:" android/build/config.gradle | grep -o '[0-9]\+' | head -1)
          bash android_plugins/speech_commands/build.sh "$COMPILE"

      - name: Configurar Godot para Android
        run: |
          godot --headless --editor --quit || true
          SETTINGS=$(ls ~/.config/godot/editor_settings-*.tres | head -1)
          echo "Ajustes: $SETTINGS"
          {
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA_HOME\""
          } >> "$SETTINGS"

      - name: Poner versión en el proyecto
        run: |
          sed -i "s/^version\/code=.*/version\/code=${VERSION_CODE}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${VERSION_NAME}\"/" export_presets.cfg
          sed -i "s/^config\/version=.*/config\/version=\"${VERSION_NAME}\"/" project.godot

      - name: Importar recursos
        run: godot --headless --import || true

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/ci/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: tankahead
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --export-debug "Android" "build/ATankStory-${VERSION_NAME}.apk"
          ls -la build

      - name: Comprobar que el APK lleva los plugins (anuncios y compras)
        run: |
          APK="build/ATankStory-${VERSION_NAME}.apk"
          unzip -p "$APK" AndroidManifest.xml > manifest.bin
          if { strings -e l manifest.bin; strings manifest.bin; } | grep -q "ca-app-pub-"; then
            echo "El APK lleva el ID de aplicación de AdMob"
          else
            echo "::error title=APK sin AdMob::El APK no contiene el plugin de anuncios (¿compilado sin Gradle?)"
            exit 1
          fi
      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION_NAME}" "build/ATankStory-${VERSION_NAME}.apk" \
            --title "A Tank Story ${VERSION_NAME}" \
            --notes "Compilación automática ${VERSION_NAME} (versionCode ${VERSION_CODE}), commit ${GITHUB_SHA::7}"
