name: Verify

# Comprobación visual en ramas de trabajo: ejecuta el juego con un renderizador por software
# (con el mismo método de dibujo que usa el teléfono, «mobile»), guarda capturas de tanques,
# escenarios y partidas, y falla si hay errores de scripts o shaders.
on:
  push:
    branches-ignore: [main, audio, audio-raw, verify-shots, aab-setup, aab-report, billing-plugin, billing-plugin-out, admob-plugin, admob-plugin-out, store-shots, store-shots-out]
  workflow_dispatch:

permissions:
  contents: write

# Un empuje nuevo a la misma rama cancela la comprobación anterior, que ya no sirve.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_CHANNEL: "stable"

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot y renderizador por software
        run: |
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl -fsSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" /usr/local/bin/godot
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb mesa-vulkan-drivers libvulkan1 libgl1-mesa-dri

      - name: Importar recursos
        run: godot --headless --import 2>&1 | tee import.log || true

      - name: Misiones, navegación, tutorial, lomas, menús y tanques del jugador (sin gráficos)
        env:
          SHOTS_ONLY: "story mapas rios asaltos nav tutorial sky ai ctf fit lomas pausa tanques aliados halo formacion intro barcos carga seguir aereo costa mira sonido"
        run: |
          timeout 1800 godot --headless --path . --audio-driver Dummy res://tools/verify/shots.tscn 2>&1 | tee logic.log || true
          grep -E "^(VOZ|NAV|STORY|MAPA|RIO|ASALTO|INTRO|BARCOS|CARGA R|CARGA h|CARGA s|SEGUIR|AEREO|COSTA|MIRA|CAMPAIGN|PREMIUM|ADS|REACH|CLIMB|TUTORIAL|SKY|AI|CTF|FIT|LOMA|PAUSA|TANQUES|ALIADOS|HALO|FORMACION)" logic.log || true

      - name: Anuncios coherentes (AdsConfig y android_export.cfg)
        run: |
          A=$(grep -oP 'const IS_REAL: bool = \K(true|false)' core/ads_config.gd)
          B=$(grep -oP '^is_real=\K(true|false)' addons/AdmobPlugin/android_export.cfg)
          echo "AdsConfig.IS_REAL=$A, android_export.cfg is_real=$B"
          [ -n "$A" ] && [ "$A" = "$B" ] || { echo "IS_REAL no coincide entre core/ads_config.gd y android_export.cfg"; exit 1; }

      - name: Capturas
        run: |
          timeout 2100 xvfb-run -a -s "-screen 0 1280x720x24" godot --path . --audio-driver Dummy --rendering-driver vulkan --rendering-method mobile --resolution 1280x720 res://tools/verify/shots.tscn 2>&1 | tee run.log || true
          ls -la shots_out || true

      - name: Errores de scripts y shaders
        run: |
          grep -nE "SCRIPT ERROR|SHADER ERROR|Parse Error|Compile Error|Failed to load script|Invalid (call|access|assignment|operands|get index)|^ERROR" run.log import.log logic.log | head -150 > errors.txt || true
          cat errors.txt
          grep -q "SHOTS DONE" run.log || { echo "Las capturas no terminaron"; tail -60 run.log; exit 1; }
          grep -q "SHOTS DONE" logic.log || { echo "La prueba de misiones y navegación no terminó"; tail -60 logic.log; exit 1; }
          grep -q "VOZ RESULT fallos: 0 " logic.log || { echo "El reconocimiento de órdenes por voz falla en algún caso"; grep "^VOZ" logic.log; exit 1; }
          grep -q "NAV RESULT fallos de la navegación con rodeo: 0" logic.log || { echo "Algún tanque con rodeo no llegó a su destino"; exit 1; }
          grep -q "PREMIUM RESULT campañas con un reparto de gratuitas incorrecto: 0" logic.log || { echo "El reparto de misiones gratuitas y premium no es el esperado"; grep "^PREMIUM" logic.log; exit 1; }
          grep -q "ADS RESULT fallos de anuncios y desbloqueo: 0" logic.log || { echo "Fallo en los anuncios o en el desbloqueo por recompensa"; grep "^ADS" logic.log; exit 1; }
          grep -q "REACH RESULT inaccesibles: 0" logic.log || { echo "Hay objetivos u objetos inaccesibles"; exit 1; }
          grep -q "TUTORIAL RESULT lecciones sin completar: 0" logic.log || { echo "Alguna lección del tutorial no se completa"; grep "^TUTORIAL" logic.log; exit 1; }
          grep -q "CTF RESULT la máquina juega a capturar: OK" logic.log || { echo "Los tanques de la máquina no van a por la bandera"; grep "^CTF" logic.log; exit 1; }
          grep -q "AI RESULT tanques que no reaccionan al fuego: 0" logic.log || { echo "Un tanque enemigo no reacciona cuando le disparan"; grep "^AI" logic.log; exit 1; }
          grep -q "SKY RESULT derribos sobre tanques: 0 de" logic.log || { echo "Un avión derribado cae encima de un tanque"; exit 1; }
          grep -q "MAPAS RESULT inaccesibles: 0 | en el agua: 0 " logic.log || { echo "En algún trazado hay objetivos inaccesibles o cosas metidas en un río"; grep -E "^(MAPA MAL|REACH MAL|MAPAS)" logic.log; exit 1; }
          grep -q "ASALTO RESULT fallos: 0" logic.log || { echo "Las oleadas o los carros atrincherados de los asaltos no salen como deben"; grep "^ASALTO" logic.log; exit 1; }
          grep -q "CARGA RESULT fallos: 0" logic.log || { echo "La pantalla de carga no tapa el montaje del campo o no deja la partida en marcha"; exit 1; }
          grep -q "SEGUIR RESULT fallos: 0" logic.log || { echo "«Seguir en el campo» tras la victoria no funciona"; exit 1; }
          grep -q "COSTA RESULT fallos: 0" logic.log || { echo "Las partidas junto al mar de supervivencia o captura la bandera no salen como deben"; grep "^COSTA" logic.log; exit 1; }
          grep -q "MIRA RESULT fallos: 0" logic.log || { echo "La mira con un objetivo fijado no queda sobre el objetivo o tiembla"; grep "^MIRA" logic.log; exit 1; }
          grep -q "SONIDO RESULT fallos: 0" logic.log || { echo "El cañonazo y la explosión reales no suenan o el interruptor de la pausa no los cambia"; grep "^SONIDO" logic.log; exit 1; }
          grep -q "AEREO RESULT fallos: 0" logic.log || { echo "El ataque aéreo de supervivencia no entra como debe"; grep "^AEREO" logic.log; exit 1; }
          grep -q "BARCOS RESULT fallos: 0" logic.log || { echo "La misión de hundir barcos no sale como debe"; grep "^BARCOS" logic.log; exit 1; }
          grep -q "INTRO RESULT fallos: 0" logic.log || { echo "La entrada aérea de las misiones no empieza o no acaba como debe"; grep "^INTRO" logic.log; exit 1; }
          grep -q "RIO RESULT fallos: 0" logic.log || { echo "Los tanques no cruzan el río por los pasos, o lo cruzan por donde no hay paso"; grep "^RIO" logic.log; exit 1; }
          if grep -q "SKY MAL" logic.log; then exit 1; fi
          grep -q "CLIMB RESULT.*(OK)" logic.log || { echo "Un tanque puede subirse a una colina"; exit 1; }
          grep -q "LOMA RESULT los tanques suben y bajan las lomas: OK" logic.log || { echo "Los tanques no suben o no bajan bien las lomas"; grep "^LOMA" logic.log; exit 1; }
          grep -q "PAUSA RESULT menús de opciones que no caben en pantalla: 0 " logic.log || { echo "El menú de opciones no cabe en pantalla en algún idioma"; grep "^PAUSA" logic.log; exit 1; }
          grep -q "TANQUES RESULT fichas de jugador fuera de lo previsto: 0" logic.log || { echo "Algún tanque del jugador tiene una ficha fuera de lo previsto"; grep "^TANQUES" logic.log; exit 1; }
          grep -q "TANQUES RESULT el casco de un cazacarros sigue a la mira: OK" logic.log || { echo "El casco de un cazacarros no sigue a la mira del jugador"; grep "^TANQUES casamata" logic.log; exit 1; }
          grep -q "ALIADOS RESULT fallos de aliados y refuerzos: 0" logic.log || { echo "Los aliados o sus refuerzos no salen como deben"; grep "^ALIADOS" logic.log; exit 1; }
          grep -q "HALO RESULT fallos de los bordes de ayuda: 0" logic.log || { echo "Los bordes de objetivos y enemigos no se ponen o no se quitan bien"; grep "^HALO" logic.log; exit 1; }
          grep -q "FORMACION RESULT fallos de la formación de los aliados: 0" logic.log || { echo "Los aliados que siguen al jugador se amontonan, se le ponen delante o no llegan a su puesto"; grep "^FORMACION" logic.log; exit 1; }
          grep -q "ADS DIAG RESULT fallos del diagnóstico oculto de anuncios: 0" logic.log || { echo "El diagnóstico oculto de los anuncios no se enseña o no se quita bien"; grep "^ADS" logic.log; exit 1; }
          grep -q "SOMBRAS RESULT.*(OK)" run.log || { echo "Los bordes de ayuda o el contorno de los tanques cambian las sombras del campo"; grep "^SOMBRAS" run.log; exit 1; }
          grep -q "FIT RESULT páginas del menú que no caben en pantalla: 0 de" logic.log || { echo "Alguna página del menú no cabe en la pantalla sin desplazarla"; grep "^FIT" logic.log; exit 1; }
          if grep -qE "SCRIPT ERROR|SHADER ERROR|Parse Error|Compile Error" errors.txt; then exit 1; fi
          # Errores del motor durante las pruebas: salen cuando el juego le pasa algo que no admite y,
          # en el teléfono, frenan y dejan cosas a medias. Solo cuentan los de antes de «SHOTS DONE»;
          # los de después son recursos sin liberar al cerrar.
          for log in logic.log run.log; do sed '/SHOTS DONE/q' "$log" | grep -E "^ERROR" || true; done > engine_errors.txt
          if [ -s engine_errors.txt ]; then echo "El motor ha dado errores durante las pruebas:"; sed -E 's/-?[0-9]+(\.[0-9]+)?/N/g' engine_errors.txt | sort | uniq -c | sort -rn | head -20; exit 1; fi

      - name: Publicar capturas en la rama verify-shots
        if: always()
        run: |
          mkdir -p shots_out
          cp run.log import.log logic.log errors.txt shots_out/ 2>/dev/null || true
          cd shots_out
          git init -q
          git checkout -q -b verify-shots
          git add -A
          git -c user.name="verify" -c user.email="verify@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" verify-shots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: |
            shots_out
            run.log
            import.log
            errors.txt
